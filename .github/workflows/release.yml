name: release

on:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block release until inventory is complete
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f docs/dependency-licenses.md
          ! grep -q 'TBD' docs/dependency-licenses.md
