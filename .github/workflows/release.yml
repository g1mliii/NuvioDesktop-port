name: release

on:
  workflow_dispatch:

jobs:
  guard:
    name: compliance + source bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Required compliance files exist
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f docs/dependency-licenses.md
          test -f docs/source-availability.md
          test -f docs/native-dependency-provenance.md

      - name: License inventory is current and has no unresolved rows
        run: |
          ./scripts/generate-license-inventory.sh
          ! grep -q 'TBD' docs/dependency-licenses.md
          # Fail if the committed inventory drifted from the generated one.
          git diff --exit-code docs/dependency-licenses.md

      - name: Generate source bundle (GPL)
        run: ./scripts/make-source-bundle.sh

      - name: Build labelled Linux artifact
        run: ./scripts/package-linux.sh linux-x64

      - name: Artifact-contents gate (LICENSE/NOTICE/inventory/source/provenance)
        env:
          NUVIO_ARTIFACT_DIR: artifacts/publish/linux-x64
        run: dotnet test tests/Nuvio.Desktop.Tests/Nuvio.Desktop.Tests.csproj -c Release --filter "FullyQualifiedName~Phase8PackagingTests"

      - name: Upload source bundle
        uses: actions/upload-artifact@v5
        with:
          name: nuvio-desktop-source
          path: artifacts/source
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: nuvio-desktop-linux-x64
          path: artifacts/dist
          if-no-files-found: error
