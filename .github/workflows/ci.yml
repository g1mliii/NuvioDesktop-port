name: ci

on:
  push:
    branches: [main, desktop-port]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install mpv on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpv -y --no-progress
          $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $mpv = Get-ChildItem -Path "$chocoRoot\lib\mpvio.install\tools" -Filter mpv.exe -Recurse -File | Select-Object -First 1 -ExpandProperty FullName
          if (-not $mpv) {
            throw 'Chocolatey installed mpv, but mpv.exe was not found under the mpvio.install tools directory.'
          }
          "NUVIO_MPV_PATH=$mpv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install mpv on macOS
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install mpv on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
        env:
          NUVIO_RUN_MPV_INTEGRATION: '1'
      - name: Compliance files
        shell: pwsh
        run: |
          $required = @('LICENSE', 'NOTICE', 'docs/legal-compliance.md', 'docs/dependency-licenses.md', 'docs/mpv-setup.md')
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required compliance file: $path"
            }
          }

  perf:
    name: perf (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    # Phase 9 report-only performance probe: captures cold-start / catalog-scroll / details-loop managed-heap
    # + timing baselines per OS and uploads them. Absolute budgets are NOT enforced here (deterministic
    # virtualization/cache/teardown invariants hard-fail in the build-test job instead).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Nuvio.Desktop/Nuvio.Desktop.csproj -c Release
      - name: Run perf probe
        run: dotnet run --project src/Nuvio.Desktop/Nuvio.Desktop.csproj -c Release --no-build -- --perf-probe --perf-out artifacts/perf/perf-${{ matrix.os }}.json
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}
          path: artifacts/perf/
